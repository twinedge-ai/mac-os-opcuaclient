<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="1800" viewBox="0 0 2880 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EAF2F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#16302A" flood-opacity="0.18"/>
    </filter>
    <style>
      .eyebrow { font: 500 30px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; fill: #5E6B76; }
      .title { font: 760 92px -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; fill: #13201D; }
      .subtitle { font: 420 38px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; fill: #4D5A65; }
      .nav { font: 620 30px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; fill: #16231F; }
      .nav-muted { font: 500 28px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; fill: #78848E; }
      .row-title { font: 650 34px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; fill: #15231F; }
      .row-detail { font: 420 27px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; fill: #6B7680; }
      .badge { font: 650 22px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; }
      .metric-label { font: 520 26px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; fill: #65717C; }
      .metric-value { font: 760 42px -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
      .small { font: 520 24px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; fill: #77838C; }
    </style>
  </defs>

  <rect width="2880" height="1800" fill="url(#bg)"/>
  <text x="260" y="236" class="eyebrow">OPC UA Client for macOS</text>
  <text x="260" y="345" class="title">OPC UA server profiles</text>
  <text x="260" y="420" class="subtitle">Configure secure opc.tcp connections and reusable environments.</text>

  <g filter="url(#shadow)">
    <rect x="260" y="520" width="2360" height="1030" rx="30" fill="#FDFEFE" stroke="#D7DEE8"/>
    <rect x="260" y="520" width="420" height="1030" rx="30" fill="#EEF5F3"/>
    <rect x="260" y="520" width="2360" height="76" rx="30" fill="#FFFFFF"/>
    <circle cx="322" cy="558" r="10" fill="#FF5F57"/>
    <circle cx="362" cy="558" r="10" fill="#FFBD2E"/>
    <circle cx="402" cy="558" r="10" fill="#28C840"/>

    <text x="330" y="690" class="nav">Workspaces</text>
    <rect x="315" y="740" width="300" height="58" rx="16" fill="#00A86B" opacity="0.13"/>
    <text x="355" y="778" class="nav" fill="#00A86B">Servers</text>
    <text x="355" y="858" class="nav-muted">Read/Write</text>
    <text x="355" y="928" class="nav-muted">Monitoring</text>
    <text x="355" y="998" class="nav-muted">Diagnostics</text>
    <text x="355" y="1068" class="nav-muted">Security</text>

    <text x="760" y="455" class="small"></text>
    <text x="760" y="470" class="small"></text>
    <text x="760" y="470" class="small"></text>
    <text x="760" y="655" class="nav">OPC UA server profiles</text>
    <text x="760" y="704" class="small">Native SwiftUI interface with focused industrial workflows</text>
    
    <g>
      <rect x="760" y="520" width="1460" height="136" rx="18" fill="#FFFFFF" stroke="#D7DEE8"/>
      <circle cx="820" cy="588" r="24" fill="#00A86B" opacity="0.14"/>
      <circle cx="820" cy="588" r="9" fill="#00A86B"/>
      <text x="870" y="576" class="row-title">Production Line 1</text>
      <text x="870" y="611" class="row-detail">opc.tcp://192.168.10.45:4840</text>
      <rect x="1980" y="563" width="180" height="50" rx="25" fill="#00A86B" opacity="0.12"/>
      <text x="2070" y="596" text-anchor="middle" class="badge" fill="#00A86B">Connected</text>
    </g>
    

    <g>
      <rect x="760" y="680" width="1460" height="136" rx="18" fill="#FFFFFF" stroke="#D7DEE8"/>
      <circle cx="820" cy="748" r="24" fill="#00A86B" opacity="0.14"/>
      <circle cx="820" cy="748" r="9" fill="#00A86B"/>
      <text x="870" y="736" class="row-title">PLC Test Bench</text>
      <text x="870" y="771" class="row-detail">opc.tcp://localhost:10000</text>
      <rect x="1980" y="723" width="180" height="50" rx="25" fill="#00A86B" opacity="0.12"/>
      <text x="2070" y="756" text-anchor="middle" class="badge" fill="#00A86B">Ready</text>
    </g>
    

    <g>
      <rect x="760" y="840" width="1460" height="136" rx="18" fill="#FFFFFF" stroke="#D7DEE8"/>
      <circle cx="820" cy="908" r="24" fill="#00A86B" opacity="0.14"/>
      <circle cx="820" cy="908" r="9" fill="#00A86B"/>
      <text x="870" y="896" class="row-title">Packaging Cell</text>
      <text x="870" y="931" class="row-detail">opc.tcp://10.20.5.12:4840</text>
      <rect x="1980" y="883" width="180" height="50" rx="25" fill="#00A86B" opacity="0.12"/>
      <text x="2070" y="916" text-anchor="middle" class="badge" fill="#00A86B">Saved</text>
    </g>
    
    
    <g>
      <rect x="760" y="1260" width="360" height="190" rx="24" fill="#FFFFFF" stroke="#D7DEE8"/>
      <text x="794" y="1325" class="metric-label">Security</text>
      <text x="794" y="1394" class="metric-value" fill="#00A86B">Sign &amp; Encrypt</text>
    </g>
    

    <g>
      <rect x="1170" y="1260" width="360" height="190" rx="24" fill="#FFFFFF" stroke="#D7DEE8"/>
      <text x="1204" y="1325" class="metric-label">Auth</text>
      <text x="1204" y="1394" class="metric-value" fill="#00A86B">Username</text>
    </g>
    

    <g>
      <rect x="1580" y="1260" width="360" height="190" rx="24" fill="#FFFFFF" stroke="#D7DEE8"/>
      <text x="1614" y="1325" class="metric-label">Quality</text>
      <text x="1614" y="1394" class="metric-value" fill="#00A86B">Good</text>
    </g>
    
  </g>
</svg>
